syntax = "proto3";

package notification;

service NotificationService {
  rpc CreateOrderNotification (NotificationRequest) returns (NotificationReply);
}

message NotificationRequest {
  int32 user_id = 1;
  int32 order_id = 2;
  string message = 3;
}

message NotificationReply {
  bool ok = 1;
  string channel = 2;
  int32 notification_id = 3;
}
